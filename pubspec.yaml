name: myqrcode
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.1.4
  circle_nav_bar: ^2.2.0
  pretty_qr_code: ^3.5.0
  image:
  intl: 
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  google_fonts: ^7.0.2
  flutter_bounceable: ^1.2.0
  widgets_to_image: ^2.0.1
