  lottie: ^3.3.2
  sqflite: 
  shared_preferences: ^2.5.4
  shimmer:

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons:
  flutter_lints: ^6.0.0

  
flutter_launcher_icons:
